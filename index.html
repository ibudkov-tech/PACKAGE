<style>
  :root {
    --bg: #0b0b0c;
    --slide-bg: #0b0b0c;
    --accent: #ffffff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html {
    scroll-behavior: smooth;
    overflow-x: hidden;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  /* scroll-snap container */
  .scroller {
    scroll-snap-type: y proximity;
  }
  .deck {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  .slide {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--slide-bg);
    overflow: hidden;
    scroll-snap-align: start;
    scroll-margin-top: 64px;
  }
  .slide img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }
  .slide.has-video img {
    transition: transform 0.35s ease, filter 0.35s ease;
  }
  .slide.has-video:hover img {
    transform: scale(1.015);
    filter: brightness(1.05);
  }
  .hotspot {
    position: absolute;
    border: none;
    margin: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    display: block;
  }
  .hotspot-video { -webkit-tap-highlight-color: transparent; }
  .hotspot-link { -webkit-tap-highlight-color: transparent; }

  /* top progress hairline */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.08);
    z-index: 60;
  }
  .topbar-fill {
    height: 100%;
    width: 0%;
    background: #fff;
    transition: width 0.1s linear;
  }

  /* sticky chapter nav */
  .chapternav {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 28px;
    padding: 16px 28px;
    background: rgba(11,11,12,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .brand {
    font-weight: 700;
    letter-spacing: 0.04em;
    font-size: 13px;
    white-space: nowrap;
    opacity: 0.9;
    padding-right: 8px;
    border-right: 1px solid rgba(255,255,255,0.15);
  }
  .chapter-item {
    position: relative;
  }
  .chapter-link {
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    font-size: 13px;
    white-space: nowrap;
    padding: 6px 2px;
    position: relative;
    display: inline-block;
    transition: color 0.2s ease;
  }
  .chapter-link::after {
    content: '';
    position: absolute;
    left: 0; right: 100%;
    bottom: -1px;
    height: 2px;
    background: #fff;
    transition: right 0.25s ease;
  }

  /* hover dropdown of individual cases within a chapter (desktop/pointer only) */
  .chapter-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    /* no gap to the menu item above: a real empty strip there would drop :hover
       mid-transition and make the dropdown vanish while the cursor is still moving */
    margin-top: 0;
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    min-width: 260px;
    border-radius: 10px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }
  .chapter-dropdown-inner {
    display: flex;
    flex-direction: column;
    padding: 8px;
    border-radius: 10px;
    background: rgba(18,18,20,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  }
  .chapter-sub-link {
    color: rgba(255,255,255,0.68);
    text-decoration: none;
    font-size: 13px;
    line-height: 1.4;
    white-space: nowrap;
    padding: 7px 10px;
    border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .chapter-sub-client {
    color: rgba(255,255,255,0.45);
    font-size: 11px;
    letter-spacing: 0.03em;
  }
  .chapter-sub-link:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }
  .chapter-sub-link:hover .chapter-sub-client {
    color: rgba(255,255,255,0.7);
  }
  @media (hover: hover) and (pointer: fine) {
    .chapter-item:hover .chapter-dropdown {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
  }
  .chapter-link:hover { color: rgba(255,255,255,0.85); }
  .chapter-link.active { color: #fff; }
  .chapter-link.active::after { right: 0; }

  /* floating slide counter / prev-next */
  .slidenav {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.18);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .slidenav.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .slidenav button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .slidenav button:hover { background: rgba(255,255,255,0.15); }
  .slidenav button:disabled { opacity: 0.3; cursor: default; }
  .slidenav button:disabled:hover { background: transparent; }
  .slide-counter {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.8);
    min-width: 62px;
    text-align: center;
    white-space: nowrap;
  }

  /* inline video playback (replaces the slide image in place) */
  .slide-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    z-index: 5;
    background: #000;
  }
  .slide-close {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 6;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 20px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .slide-close:hover { background: rgba(0,0,0,0.75); }

  @media (max-width: 700px) {
    .chapternav { gap: 18px; padding: 12px 16px; }
    .brand { display: none; }
  }

  .chapternav { gap: 4px 22px; }
  .chapter-sub-link { white-space: normal; max-width: 340px; }
</style>

<div class="slidenav" id="slidenav">
  <button id="prevSlide" aria-label="Предыдущий слайд">&#8249;</button>
  <span class="slide-counter" id="slideCounter">1 / 83</span>
  <button id="nextSlide" aria-label="Следующий слайд">&#8250;</button>
</div>

<script>
(function() {
  var N_PAGES = 175;
  var CHAPTERS = [{"title": "Об агентстве", "start": 1}, {"title": "Фестивальные кейсы", "start": 10}, {"title": "FMCG", "start": 56}, {"title": "E-grocery", "start": 75}, {"title": "Non-food", "start": 123}];

  function playInline(btn) {
    var section = btn.closest('.slide');
    if (!section || section.querySelector('.slide-video')) return;

    var iframe = document.createElement('iframe');
    iframe.className = 'slide-video';
    iframe.src = btn.getAttribute('data-embed');
    iframe.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
    iframe.allowFullscreen = true;

    // Vimeo letterboxes/pillarboxes a video whose native aspect ratio doesn't match our
    // 16:9 slide. When we know the real aspect (baked in at build time), scale the iframe
    // up and center it so the video content covers the full slide instead of showing bars.
    var videoAspect = parseFloat(btn.getAttribute('data-aspect'));
    if (videoAspect) {
      var containerAspect = 16 / 9;
      var scale = Math.max(containerAspect / videoAspect, videoAspect / containerAspect);
      if (scale > 1.01 && scale <= 1.4) {
        iframe.style.width = (scale * 100) + '%';
        iframe.style.height = (scale * 100) + '%';
        iframe.style.left = '50%';
        iframe.style.top = '50%';
        iframe.style.right = 'auto';
        iframe.style.bottom = 'auto';
        iframe.style.transform = 'translate(-50%, -50%)';
      } else if (scale > 1.01) {
        // too wide/narrow to crop safely: fit the iframe to the video so the bars are the
        // slide's own black background, not the (white) empty canvas of the iframe.
        iframe.style.left = '50%';
        iframe.style.top = '50%';
        iframe.style.right = 'auto';
        iframe.style.bottom = 'auto';
        iframe.style.transform = 'translate(-50%, -50%)';
        if (videoAspect > containerAspect) {
          iframe.style.height = (100 * containerAspect / videoAspect) + '%';
        } else {
          iframe.style.width = (100 * videoAspect / containerAspect) + '%';
        }
      }
    }
    section.style.background = '#000';
    var slideImg = section.querySelector('img');
    if (slideImg) slideImg.style.visibility = 'hidden';

    var closeBtn = document.createElement('button');
    closeBtn.className = 'slide-close';
    closeBtn.setAttribute('aria-label', 'Закрыть видео');
    closeBtn.innerHTML = '&times;';
    closeBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      iframe.remove();
      closeBtn.remove();
      section.style.background = '';
      if (slideImg) slideImg.style.visibility = '';
      section.querySelectorAll('.hotspot').forEach(function(h) { h.style.visibility = ''; });
    });

    section.querySelectorAll('.hotspot').forEach(function(h) { h.style.visibility = 'hidden'; });
    section.appendChild(iframe);
    section.appendChild(closeBtn);
  }

  document.querySelectorAll('.hotspot-video').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      playInline(btn);
    });
  });

  // scroll progress
  var fill = document.getElementById('topbarFill');
  function onScroll() {
    var h = document.documentElement;
    var scrolled = h.scrollTop;
    var max = h.scrollHeight - h.clientHeight;
    var pct = max > 0 ? (scrolled / max) * 100 : 0;
    fill.style.width = pct + '%';
  }
  document.addEventListener('scroll', onScroll, {passive: true});
  onScroll();

  // active slide tracking via IntersectionObserver
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var chapterLinks = Array.prototype.slice.call(document.querySelectorAll('.chapter-link'));
  var counterEl = document.getElementById('slideCounter');
  var slidenav = document.getElementById('slidenav');
  var prevBtn = document.getElementById('prevSlide');
  var nextBtn = document.getElementById('nextSlide');
  var currentIndex = 0;

  function setActiveChapter(chapterIdx) {
    chapterLinks.forEach(function(a) {
      a.classList.toggle('active', parseInt(a.getAttribute('data-chapter-idx'), 10) === chapterIdx);
    });
  }

  function updateCurrent(index) {
    currentIndex = index;
    var page = parseInt(slides[index].getAttribute('data-page'), 10);
    counterEl.textContent = (index + 1) + ' / ' + slides.length;
    setActiveChapter(parseInt(slides[index].getAttribute('data-chapter'), 10));
    prevBtn.disabled = index <= 0;
    nextBtn.disabled = index >= slides.length - 1;
  }

  var observer = new IntersectionObserver(function(entries) {
    var best = null;
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        if (!best || entry.intersectionRatio > best.intersectionRatio) best = entry;
      }
    });
    if (best) {
      var idx = slides.indexOf(best.target);
      if (idx !== -1) updateCurrent(idx);
    }
  }, { threshold: [0.25, 0.5, 0.75], rootMargin: '-64px 0px -20% 0px' });
  slides.forEach(function(s) { observer.observe(s); });

  function goTo(index) {
    index = Math.max(0, Math.min(slides.length - 1, index));
    slides[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  prevBtn.addEventListener('click', function() { goTo(currentIndex - 1); });
  nextBtn.addEventListener('click', function() { goTo(currentIndex + 1); });

  document.addEventListener('keydown', function(e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); goTo(currentIndex + 1); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goTo(currentIndex - 1); }
  });

  var revealTimer = null;
  window.addEventListener('scroll', function() {
    slidenav.classList.add('visible');
    clearTimeout(revealTimer);
    revealTimer = setTimeout(function() { slidenav.classList.remove('visible'); }, 2200);
  }, {passive: true});

  updateCurrent(0);
})();
</script>
